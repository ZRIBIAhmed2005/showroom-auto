<app-head-bar></app-head-bar>
<app-search-bar [autos]="autoList" (onSelectCar)="selectCar($event)"></app-search-bar>

@if (selectedCar; as car) {
    <section class="selected-car" aria-live="polite">
        <div>
            <p class="eyebrow">SELECTED VEHICLE</p>
            <h2>{{ car.brand }} {{ car.model }}</h2>
            <p>{{ car.description }}</p>
        </div>
        <button type="button" (click)="clearSelection()">Close</button>
    </section>
}
